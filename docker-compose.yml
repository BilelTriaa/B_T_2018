services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: axiome
      POSTGRES_PASSWORD: axiome_dev_password
      POSTGRES_DB: axiome
    ports:
      - "5433:5432"
    volumes:
      - axiome_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axiome -d axiome"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: axiome
      MINIO_ROOT_PASSWORD: axiome_minio_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - axiome_minio_data:/data

volumes:
  axiome_pg_data:
  axiome_minio_data:
